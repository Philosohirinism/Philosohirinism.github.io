ts/portrait-blue-web-v1.jpg" width="1216" height="1293" alt="海维舟的肖像" loading="lazy"><article class="prose"><p class="lead-paragraph">我是海维舟（HAI Weizhou），2025年进入大阪大学国际公共政策研究科（OSIPP）攻读硕士。</p><p>我的学术研究关注批判性国际关系理论、本体安全、ASEAN、主权与合法性。</p><p>我的工作也包括英语教学、申请支持、政策研究与学术沟通。我通过UjiBricks的中文视频探讨思想与生活中的问题。</p><a href="/zh/career/experience/" class="text-link">工作经历 <span aria-hidden="true">↗</span></a><br><a href="/zh/about/contact/" class="text-link">联系 <span aria-hidden="true">↗</span></a></article></div></div></main><footer class="site-footer"><div class="footer-top"><a href="/zh/" class="footer-name" translate="no">HAI Weizhou</a><p>研究、教学与思想。</p><a href="/zh/about/contact/" class="footer-contact">联系 <span aria-hidden="true">↗</span></a></div><div class="footer-bottom"><span>© 2026 HAI Weizhou</span><a href="/zh/about/" >关于本网站</a></div></footer></body></html>
